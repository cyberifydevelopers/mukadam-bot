<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Muccaddam Bot</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563eb'/%3E%3Cpath d='M9 8h10l5 5v11a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z' fill='white'/%3E%3Cpath d='M11 17h10M11 21h7' stroke='%232563eb' stroke-width='2'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --sidebar: #111827; --sidebar-fg: #cbd5e1; --sidebar-active: #1f2937;
    --fg: #111827; --muted: #6b7280; --border: #e5e7eb; --accent: #2563eb; --accent-fg: #ffffff;
    --ok: #15803d; --ok-bg: #dcfce7; --warn: #a16207; --warn-bg: #fef9c3; --bad: #b91c1c; --bad-bg: #fee2e2;
    --info: #1d4ed8; --info-bg: #dbeafe; --neutral-bg: #f3f4f6; --credit: #15803d; --debit: #b91c1c;
    --bubble-out: #dcf8c6; --bubble-in: #ffffff; --chat-bg: #efeae2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0f17; --panel: #131a24; --sidebar: #070a10; --sidebar-fg: #94a3b8; --sidebar-active: #1a2330;
      --fg: #e5e7eb; --muted: #94a3b8; --border: #243042; --accent: #3b82f6;
      --ok: #4ade80; --ok-bg: #0f2e1b; --warn: #facc15; --warn-bg: #2e2708; --bad: #f87171; --bad-bg: #3a1212;
      --info: #93c5fd; --info-bg: #132646; --neutral-bg: #1c2533; --credit: #4ade80; --debit: #f87171;
      --bubble-out: #144d37; --bubble-in: #1c2533; --chat-bg: #0e141c;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--fg); }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .layout { display: flex; min-height: 100vh; }

  /* Sidebar */
  aside { width: 232px; flex-shrink: 0; background: var(--sidebar); color: var(--sidebar-fg); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
  .brand { padding: 20px 20px 16px; color: #fff; font-weight: 700; font-size: 16px; letter-spacing: .2px; }
  .brand small { display: block; font-weight: 400; color: var(--sidebar-fg); font-size: 12px; margin-top: 2px; }
  nav a { display: flex; align-items: center; gap: 10px; padding: 10px 20px; color: var(--sidebar-fg); border-left: 3px solid transparent; }
  nav a:hover { background: var(--sidebar-active); text-decoration: none; color: #fff; }
  nav a.active { background: var(--sidebar-active); color: #fff; border-left-color: var(--accent); }
  nav svg { width: 18px; height: 18px; flex-shrink: 0; }
  nav .count { margin-left: auto; background: var(--accent); color: #fff; border-radius: 999px; font-size: 11px; padding: 0 7px; min-width: 20px; text-align: center; }
  .sidebar-foot { margin-top: auto; padding: 16px 20px; font-size: 12px; border-top: 1px solid #1f2937; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--muted); }
  .dot.ok { background: #22c55e; } .dot.bad { background: #ef4444; } .dot.warn { background: #eab308; }

  /* Main */
  main { flex: 1; min-width: 0; padding: 24px 32px 48px; }
  header.page { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  header.page h1 { font-size: 20px; margin: 0; }
  header.page .sub { color: var(--muted); font-size: 13px; }
  header.page .actions { margin-left: auto; display: flex; gap: 8px; }
  button, .btn { font: inherit; border: 1px solid var(--border); background: var(--panel); color: var(--fg); padding: 7px 14px; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  button:hover, .btn:hover { border-color: var(--accent); text-decoration: none; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  button:disabled { opacity: .6; cursor: wait; }
  button.danger { color: var(--bad); }
  button.danger:hover { border-color: var(--bad); background: var(--bad-bg); }
  button.icon { padding: 6px 8px; display: inline-flex; align-items: center; justify-content: center; }
  .ico { width: 16px; height: 16px; flex-shrink: 0; }

  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 20px; }
  .panel > h2 { font-size: 14px; margin: 0; padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
  .panel > h2 .right { margin-left: auto; font-weight: 400; color: var(--muted); font-size: 13px; }
  .panel-body { padding: 16px 18px; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .card .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .4px; }
  .card .value { font-size: 26px; font-weight: 700; margin-top: 4px; }
  .card .hint { color: var(--muted); font-size: 12px; }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .4px; background: var(--neutral-bg); position: sticky; top: 0; }
  tr:last-child td { border-bottom: none; }
  tr.click { cursor: pointer; }
  tr.click:hover td { background: var(--neutral-bg); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .table-wrap { overflow-x: auto; }
  .activity-scroll { overflow-y: auto; }
  .scroll { max-height: 560px; overflow: auto; }
  .muted { color: var(--muted); }
  .nowrap { white-space: nowrap; }
  .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12.5px; }
  .ellipsis { max-width: 420px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .badge { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--neutral-bg); color: var(--muted); }
  .badge.ok { background: var(--ok-bg); color: var(--ok); }
  .badge.warn { background: var(--warn-bg); color: var(--warn); }
  .badge.bad { background: var(--bad-bg); color: var(--bad); }
  .badge.info { background: var(--info-bg); color: var(--info); }

  .kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px 24px; }
  .kv div .k { color: var(--muted); font-size: 12px; }
  .kv div .v { font-weight: 600; word-break: break-word; }
  .kv div .v.empty { color: var(--muted); font-weight: 400; font-style: italic; }
  .alert { padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; font-size: 13px; }
  .alert.bad { background: var(--bad-bg); color: var(--bad); }
  .alert.warn { background: var(--warn-bg); color: var(--warn); }
  .alert.info { background: var(--info-bg); color: var(--info); }
  pre.text { margin: 0; padding: 14px; max-height: 480px; overflow: auto; background: var(--neutral-bg); border-radius: 8px; white-space: pre-wrap; font-size: 12px; }
  details summary { cursor: pointer; padding: 14px 18px; font-weight: 600; }
  details[open] summary { border-bottom: 1px solid var(--border); }
  .empty-state { padding: 40px; text-align: center; color: var(--muted); }
  .credit { color: var(--credit); } .debit { color: var(--debit); }
  .steps { display: flex; flex-wrap: wrap; gap: 4px; }
  .step { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: 12px; white-space: nowrap; background: var(--neutral-bg); color: var(--muted); }
  .step.done { background: var(--ok-bg); color: var(--ok); }
  .step.active { background: var(--info-bg); color: var(--info); font-weight: 600; }
  .step.failed { background: var(--bad-bg); color: var(--bad); font-weight: 600; }
  .step.skip { background: var(--neutral-bg); color: var(--muted); text-decoration: none; }
  .step.todo { opacity: .55; }
  .spin { width: 10px; height: 10px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; display: inline-block; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  tr.live td { background: var(--info-bg); }
  .pulse { width: 9px; height: 9px; border-radius: 50%; background: #22c55e; display: inline-block; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .chip { padding: 5px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--panel); color: var(--fg); font-size: 13px; }
  .chip span { color: var(--muted); margin-left: 4px; }
  .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip.active span { color: #dbeafe; }
  .chip:hover { text-decoration: none; border-color: var(--accent); }

  /* Report formats */
  .field { padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px; font: inherit; background: var(--bg); color: var(--fg); min-width: 0; }
  .fmt-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px 24px; }
  .fmt-notes { margin: 0; padding-left: 18px; color: var(--muted); font-size: 13px; }
  .fmt-notes li { margin: 2px 0; }
  .fmt-cols { display: flex; flex-wrap: wrap; gap: 6px; }
  .fmt-actions { display: flex; flex-wrap: wrap; gap: 8px; }

  /* Stock Reports */
  .inv { display: grid; grid-template-columns: minmax(250px, 320px) 1fr; gap: 16px; align-items: start; }
  .inv-list { max-height: calc(100vh - 210px); overflow: auto; display: none; }
  .inv-list.active { display: block; animation: inv-in .3s cubic-bezier(.2,.8,.2,1); }
  @keyframes inv-in { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: none; } }
  .dd { position: relative; }
  .dd-btn { display: flex; align-items: center; gap: 10px; min-width: 300px; max-width: 100%; padding: 9px 12px 9px 14px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; color: var(--fg); font: inherit; font-weight: 600; cursor: pointer; transition: border-color .15s, box-shadow .15s; }
  .dd-btn:hover, .dd.open .dd-btn { border-color: var(--accent); }
  .dd.open .dd-btn { box-shadow: 0 0 0 3px var(--info-bg); }
  .dd-btn .dd-name { flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: opacity .15s; }
  .dd-count { font-weight: 500; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--neutral-bg); color: var(--muted); }
  .dd-chev { width: 16px; height: 16px; flex-shrink: 0; transition: transform .22s ease; }
  .dd.open .dd-chev { transform: rotate(180deg); }
  .dd-menu { position: absolute; z-index: 15; top: calc(100% + 6px); left: 0; min-width: 100%; width: max-content; max-width: 90vw; padding: 6px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 14px 34px rgba(0,0,0,.22);
    opacity: 0; transform: translateY(-8px) scale(.97); transform-origin: top left; pointer-events: none; visibility: hidden; transition: opacity .18s ease, transform .18s ease, visibility 0s linear .18s; }
  .dd.open .dd-menu { opacity: 1; transform: none; pointer-events: auto; visibility: visible; transition-delay: 0s; }
  .dd-opt { display: flex; align-items: center; justify-content: space-between; gap: 18px; width: 100%; padding: 9px 12px; background: none; border: 0; border-radius: 8px; color: var(--fg); font: inherit; text-align: left; cursor: pointer; transition: background .12s; }
  .dd-opt:hover { background: var(--info-bg); }
  .dd-opt.sel { background: var(--info-bg); font-weight: 600; }

  .inv-month { padding: 10px 14px 4px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .inv-row { display: flex; align-items: stretch; border-top: 1px solid var(--border); }
  .inv-row.active { background: var(--info-bg); }
  .inv-pick { flex: 1; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; text-align: left; padding: 9px 14px; background: none; border: 0; color: var(--fg); font: inherit; cursor: pointer; }
  .inv-pick:hover { background: var(--info-bg); }
  .inv-bar-sel { display: flex; align-items: center; gap: 12px; padding: 8px 14px; border-top: 1px solid var(--border); font-size: 13px; }
  .inv-bar-sel label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .inv-bar-sel button { margin-left: auto; }
  .inv-check { align-self: center; margin-left: 14px; cursor: pointer; }
  .inv-del { padding: 0 12px; background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 15px; }
  .inv-del:hover { color: var(--bad); }
  .inv-view { position: sticky; top: 16px; }
  .inv-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--border); }
  .inv-bar .grow { flex: 1; min-width: 160px; font-weight: 600; }
  #inv-frame { width: 100%; height: calc(100vh - 200px); min-height: 520px; border: 0; background: #fff; display: block; border-radius: 0 0 12px 12px; transition: opacity .3s ease; }
  #inv-frame.loading { opacity: 0; }
  .fmt-add { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; padding: 16px 18px; margin-bottom: 20px; }
  .fmt-add label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; }
  .fmt-add-file { flex: 2; min-width: 240px; } .fmt-add-name { flex: 1.4; min-width: 200px; }
  .fmt-add .field { width: 100%; }
  .fmt-add-hint { flex-basis: 100%; font-size: 12px; }
  .fmt-list-head { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 2px 10px; }
  .fmt-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(440px, 1fr)); gap: 16px; align-items: start; }
  .fmt-card { margin-bottom: 0; display: flex; flex-direction: column; }
  .fmt-head { padding: 14px 18px 0; }
  .fmt-title { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 15px; }
  .fmt-file { font-size: 12px; margin-top: 2px; overflow-wrap: anywhere; }
  .fmt-body { padding: 14px 18px; display: flex; flex-direction: column; gap: 12px; }
  .format-match label { display: block; font-size: 12px; margin-bottom: 4px; }
  .fmt-row { display: flex; gap: 8px; } .fmt-row .field { flex: 1; }
  .fmt-details summary { cursor: pointer; font-size: 13px; color: var(--muted); }
  .fmt-details summary:hover { color: var(--fg); }
  .fmt-actions { display: flex; gap: 8px; flex-wrap: wrap; padding: 12px 18px; border-top: 1px solid var(--border); margin-top: auto; }
  @media (max-width: 800px) { .fmt-list { grid-template-columns: 1fr; } }
  .set-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; margin-bottom: 20px; }
  .set-tile { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .set-tile-top { display: flex; align-items: center; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .set-tile-val { font-size: 18px; font-weight: 600; margin-top: 6px; }
  .set-tile-sub { font-size: 12px; margin-top: 2px; overflow-wrap: anywhere; }
  .set-cols { display: grid; grid-template-columns: minmax(300px, 2fr) 3fr; gap: 16px; align-items: start; }
  .set-path { margin-top: 6px; padding: 6px 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; font-size: 12px; overflow-wrap: anywhere; }
  .set-danger { border-color: color-mix(in srgb, var(--bad) 35%, var(--border)); margin-top: 4px; }
  .set-danger h2 { color: var(--bad); }
  @media (max-width: 1100px) { .set-cols { grid-template-columns: 1fr; } }
  .cad-status { display: flex; flex-direction: column; gap: 2px; padding: 12px 16px; border-radius: 10px; margin-bottom: 16px; font-size: 13px; }
  .cad-status b { font-size: 14px; }
  .cad-status.on { background: var(--ok-bg); color: var(--ok); }
  .cad-status.off { background: var(--warn-bg); color: var(--warn); }
  .cad-add { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; padding: 16px 18px; margin-bottom: 20px; }
  .cad-add label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; }
  .cad-add-addr { flex: 2; min-width: 240px; } .cad-add-name { flex: 1; min-width: 180px; }
  .cad-add .field { width: 100%; }
  .cad-list { overflow: hidden; }
  .cad-row { display: flex; align-items: center; gap: 14px; padding: 12px 18px; border-top: 1px solid var(--border); }
  .cad-row:first-child { border-top: 0; }
  .cad-row:hover { background: var(--info-bg); }
  .cad-avatar { flex-shrink: 0; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 14px; background: var(--info-bg); color: var(--accent); }
  .cad-avatar.domain { background: var(--neutral-bg); color: var(--muted); }
  .cad-who { flex: 1; min-width: 0; }
  .cad-name { font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .cad-addr { font-size: 12px; overflow-wrap: anywhere; }
  .cad-added { font-size: 12px; white-space: nowrap; }
  @media (max-width: 600px) { .cad-added { display: none; } }
  .file-cell { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .file-ico { flex-shrink: 0; width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; background: var(--info-bg); color: var(--accent); }
  .file-ico.bad { background: var(--bad-bg); color: var(--bad); }
  .file-ico .ico { width: 18px; height: 18px; }
  .file-txt { min-width: 0; } .file-name { font-weight: 600; max-width: 380px; } .file-sub { font-size: 12px; }
  .inv-table td { vertical-align: middle; }
  .inv-facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .fact { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; min-width: 0; }
  .fact .k { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .fact .v { font-size: 17px; font-weight: 600; margin-top: 4px; overflow-wrap: anywhere; }
  .fact .v.empty { color: var(--muted); font-weight: 400; }
  .inv-reason { padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; font-size: 13px; background: var(--info-bg); color: var(--info); }
  .inv-reason.warn { background: var(--warn-bg); color: var(--warn); }
  .inv-missing { font-size: 12px; margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--border); }
  .inv-h3 { margin: 18px 0 8px; font-size: 13px; }
  .inv-detail { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
  .inv-aside .panel:last-child, .inv-main .panel:last-child { margin-bottom: 0; }
  .inv-source { grid-template-columns: 1fr; gap: 12px; }
  .inv-aside .chat { max-height: 420px; }
  @media (max-width: 1100px) { .inv-detail { grid-template-columns: 1fr; } }
  .mail-head { display: flex; align-items: center; gap: 12px; padding: 10px 18px; border-bottom: 1px solid var(--border); font-size: 13px; background: var(--neutral-bg); }
  .mail-head .sel-col, .mail-card .sel-col { display: flex; align-items: center; }
  .mail-list { display: flex; flex-direction: column; }
  .mail-card { display: flex; align-items: flex-start; gap: 14px; padding: 16px 18px; border-top: 1px solid var(--border); }
  .mail-card:first-child { border-top: 0; }
  .mail-card.click { cursor: pointer; }
  .mail-card:hover { background: var(--neutral-bg); }
  .mail-card.selected { background: var(--info-bg); }
  .mail-card.is-new { box-shadow: inset 3px 0 0 var(--accent); }
  .mail-card.is-new .mail-subject { color: var(--accent); }
  .mail-card .sel-col { padding-top: 10px; }
  .mail-avatar { flex-shrink: 0; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 14px; background: var(--info-bg); color: var(--accent); }
  .mail-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .mail-top { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .mail-from { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mail-from .mono { font-size: 12px; }
  .mail-time { font-size: 12px; white-space: nowrap; flex-shrink: 0; }
  .mail-subject { font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
  .mail-verdict { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 13px; }
  .mail-reason { font-size: 12px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; min-width: 0; }

<script>
const $ = (sel, el = document) => el.querySelector(sel);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const main = $("#main");
const contentCache = {};

async function api(path, opts = {}) {
  const init = { method: opts.method || "GET" };
  if (opts.body !== undefined) { init.body = JSON.stringify(opts.body); init.headers = { "Content-Type": "application/json" }; }
  const res = await fetch("/api" + path, init);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.detail || `HTTP ${res.status}`);
  return body;
}

function toast(msg, ms = 3000, kind = "") {
  const t = $("#toast");
  t.innerHTML = `<span class="toast-msg">${esc(msg)}</span><button type="button" class="toast-x" aria-label="Dismiss" onclick="this.parentNode.classList.remove('show')">✕</button>`;
  t.className = "toast show " + kind;
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), ms);
}

const fmtTime = (iso) => iso ? new Date(iso).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" }) : "—";
const ago = (iso) => {
  if (!iso) return "never";
  const s = Math.round((Date.now() - new Date(iso)) / 1000);
  if (s < 60) return "just now";
  if (s < 3600) return Math.round(s / 60) + " min ago";
  if (s < 86400) return Math.round(s / 3600) + " h ago";
  return Math.round(s / 86400) + " d ago";
};
const money = (n) => n == null ? "" : Number(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const senderName = (from) => { const m = /^\s*"?([^"<]+?)"?\s*<([^>]+)>/.exec(from || ""); return m ? { name: m[1], addr: m[2] } : { name: from, addr: "" }; };

const STATUS = {

/* ---------- Our own confirmation dialog (instead of the browser's) ---------- */
// body is HTML built here, with every name passed through esc(). Resolves true / false.
function askDialog({ title, body, confirmLabel = "Delete", danger = true, typeWord = "" }) {
  return new Promise((resolve) => {
    const before = document.activeElement;
    const wrap = document.createElement("div");
    wrap.className = "modal-backdrop";
    wrap.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-icon ${danger ? "bad" : ""}">${danger ? ICON.trash : "ℹ️"}</div>
      <h3 id="modal-title">${esc(title)}</h3>
      <div class="modal-body">${body}</div>
      ${typeWord ? `<label class="modal-type">Type <b>${esc(typeWord)}</b> to confirm<input type="text" autocomplete="off" spellcheck="false" placeholder="${esc(typeWord)}"></label>` : ""}
      <div class="modal-actions"><button data-m="cancel">Cancel</button>
        <button class="${danger ? "danger-solid" : "primary"}" data-m="ok">${esc(confirmLabel)}</button></div></div>`;
    document.body.appendChild(wrap);
    const ok = wrap.querySelector('[data-m="ok"]'), input = wrap.querySelector("input");
    const done = (value) => { wrap.remove(); document.removeEventListener("keydown", onKey, true); before?.focus?.(); resolve(value); };
    const canConfirm = () => !typeWord || input.value.trim() === typeWord;
    const onKey = (e) => {
      if (e.key === "Escape") { e.preventDefault(); done(false); }
      else if (e.key === "Enter" && e.target.tagName !== "BUTTON") { e.preventDefault(); if (canConfirm()) done(true); }
    };
    if (typeWord) { ok.disabled = true; input.addEventListener("input", () => { ok.disabled = !canConfirm(); }); }
    wrap.addEventListener("mousedown", (e) => { if (e.target === wrap) done(false); });
    wrap.querySelector('[data-m="cancel"]').addEventListener("click", () => done(false));
    ok.addEventListener("click", () => { if (canConfirm()) done(true); });
    document.addEventListener("keydown", onKey, true);
    (input || wrap.querySelector('[data-m="cancel"]')).focus();  // Cancel is the default, so Enter never deletes by accident
  });
}

function updateSelBar() {

  if (sel.emails.size) parts.push(`${sel.emails.size} email${sel.emails.size > 1 ? "s" : ""}`);
  if (sel.invoices.size) parts.push(`${sel.invoices.size} file${sel.invoices.size > 1 ? "s" : ""}`);

// After every render (the page re-draws itself): tick what is still selected, drop what is gone.
function applySelection() {
  for (const kind of Object.keys(sel)) {
    const boxes = [...document.querySelectorAll(`input.sel[data-sel="${kind}"]`)];
    const present = new Set(boxes.map((b) => b.dataset.id));
    for (const id of [...sel[kind]]) if (!present.has(id)) sel[kind].delete(id);
    boxes.forEach((b) => { b.checked = sel[kind].has(b.dataset.id); b.closest("tr, .mail-card")?.classList.toggle("selected", b.checked); });
    document.querySelectorAll(`input.sel-all[data-sel-all="${kind}"]`).forEach((h) => {
      const mine = boxes.filter((b) => h.closest("table, .sel-scope")?.contains(b));
      h.checked = mine.length > 0 && mine.every((b) => b.checked);
      h.indeterminate = !h.checked && mine.some((b) => b.checked);
    });
  }
  updateSelBar();
}

document.addEventListener("change", (ev) => {
  const t = ev.target;
  if (t.matches("input.sel")) {
    sel[t.dataset.sel][t.checked ? "add" : "delete"](t.dataset.id);
  } else if (t.matches("input.sel-all")) {
    const kind = t.dataset.selAll;
    t.closest("table, .sel-scope").querySelectorAll(`input.sel[data-sel="${kind}"]`).forEach((b) => sel[kind][t.checked ? "add" : "delete"](b.dataset.id));
  } else return;
  t.blur();  // a focused field would pause the page's live refresh
  applySelection();
});

/* ---------- Live activity (Overview) ---------- */

// True while any email is mid-processing: the page then refreshes every 3 s.
let processingActive = false;
const ACTIVE_STAGES = ["reading", "analyzing", "sending"];

// One step of the progress bar: state is done / active / failed / skip / todo.
const step = (state, label, title = "") =>
  `<span class="step ${state}" title="${esc(title)}">${state === "done" ? "✓" : state === "failed" ? "✕" : state === "active" ? `<i class="spin"></i>` : state === "skip" ? "–" : "○"} ${label}</span>`;

function progressSteps(e) {
  const s = e.stage;
  const steps = [step("done", "Received", fmtTime(e.received_at))];
  // Finished, but its extracted files were deleted from the dashboard since.
  if ((s === "done" || s === "legacy") && !e.documents.length) return [...steps, step("skip", "File deleted")];
  if (s === "no_attachment") return [...steps, step("skip", "Skipped — no attachment", e.stage_detail)];
  if (s === "reading") return [...steps, step("active", "Opening file…"), step("todo", "Bank document?"), step("todo", "WhatsApp"), step("todo", "Reply")];
  steps.push(step("done", "File read", e.attachments.join(", ")));

  // One LLM read of the document decides bank / not bank AND extracts the data.
  if (s === "analyzing") {
    const scanning = /scann|vision/i.test(e.stage_detail || "");
    return [...steps, step("active", scanning ? "Scanning PDF…" : "Reading document…", e.stage_detail), step("todo", "WhatsApp"), step("todo", "Reply")];
  }
  if (s === "not_bank") return [...steps, step("skip", "Not a bank document", e.classification_reason)];
  if (s === "failed") {
    const read = e.documents.some((d) => d.status !== "FAILED_PARSE");
    return [...steps, step("failed", read ? "Failed" : "Couldn't read document", e.stage_detail)];
  }
  steps.push(step("done", e.bank_name ? `Bank document · ${esc(e.bank_name)}` : "Bank document", e.classification_reason));
  steps.push(step("done", "Data extracted"));

  // WhatsApp + reply (the first document that got a prompt)
  const d = e.documents.find((x) => x.whatsapp) || e.documents.find((x) => x.status === "SEND_FAILED") || e.documents[0];
  if (s === "sending") return [...steps, step("active", "Sending WhatsApp…"), step("todo", "Reply")];
  if (!d || d.status === "STATEMENT") return [...steps, step("skip", "Statement · not tracked")];
  if (d.status === "SEND_FAILED" || d.whatsapp === "failed") return [...steps, step("failed", "WhatsApp failed")];
  if (!d.whatsapp) return [...steps, step("todo", "WhatsApp")];
  steps.push(step("done", { sent: "WhatsApp sent ✓", delivered: "Delivered ✓✓", read: "Read ✓✓" }[d.whatsapp] || "WhatsApp sent"));
  steps.push(d.status === "CONFIRMED" ? step("done", "Saved to sheet") : d.status === "REJECTED" ? step("skip", "Skipped by you")
    : step("active", "Waiting for your YES / NO"));
  return steps;
}

// Where the time went, measured from Gmail's own receive time:
// Google → Pub/Sub notification, our pickup, and processing.
function timing(e) {
  const t = (iso) => (iso ? new Date(iso).getTime() : null);
  const secs = (a, b) => (a != null && b != null ? Math.max(0, Math.round((b - a) / 1000)) : null);
  const got = t(e.received_at), notified = t(e.notification_received_at), picked = t(e.processed_at);
  const finished = ["done", "not_bank", "no_attachment", "failed"].includes(e.stage) ? t(e.stage_updated_at) : null;
  const parts = [];
  const n = secs(got, notified), p = secs(notified ?? got, picked), f = secs(picked, finished);
  if (n != null) parts.push(`Google notified +${n}s`);
  if (p != null) parts.push(`picked up +${p}s`);
  if (f != null) parts.push(`processed in ${f}s`);
  return parts.length ? `<div class="muted" style="font-size:11px;margin-top:2px" title="Measured from when Gmail received the email">${parts.join(" · ")}</div>` : "";
}

function docSummary(d) {
  const amount = d.amount ? `${d.currency || "PKR"} ${Number(d.amount).toLocaleString()}` : null;

    <button class="icon mail-reparse" ${busy ? "disabled" : `data-action="reparse" data-id="${d.id}" data-status="${esc(d.status)}"`} title="${busy ? "Parsing…" : `Read file #${d.id} again`}">${busy ? `<span class="spin"></span>` : ICON.refresh}</button></div>

}

          : ACTIVE_STAGES.includes(e.stage) && e.stage_detail ? `<div class="muted" style="font-size:12px;margin-top:4px">${esc(e.stage_detail)}</div>`

    const emails = tests[filter] ? all.filter(tests[filter]) : all;
    const chips = [["", "All", all.length], ["new", "New", all.filter(tests.new).length], ["bank", "Bank documents", all.filter(tests.bank).length], ["other", "Not bank", all.filter(tests.other).length], ["failed", "Failed", all.filter(tests.failed).length]];
    const initials = (name) => (name || "?").replace(/[^\p{L}\p{N} ]/gu, "").trim().split(/\s+/).slice(0, 2).map((w) => w[0]).join("").toUpperCase() || "?";
    const cards = emails.map((e) => {
      const s = senderName(e.sender);
      const files = e.invoices.map((i) => {
        const name = i.pdf_filename.replace(/^[^_]+_/, "");
        const busy = parsing.has(String(i.id));
        return `<div class="mail-file"><a class="mail-file-link" href="#invoice/${i.id}" title="${esc(name)}">${ICON.file}<span class="ellipsis">${esc(name === "email_body.txt" ? "Email body" : name)}</span></a>
          ${statusBadge(i.status)}${needsFormatBadge(i.needs_format)}
          <button class="icon mail-reparse" ${busy ? "disabled" : `data-action="reparse" data-id="${i.id}" data-status="${esc(i.status)}"`} title="${busy ? "Parsing…" : `Read file #${i.id} again`}">${busy ? `<span class="spin"></span>` : ICON.refresh}</button></div>`;
      }).join("");
      const isNew = tests.new(e);
      return `<div class="mail-card${e.invoices[0] ? " click" : ""}${isNew ? " is-new" : ""}" data-href="${e.invoices[0] ? "#invoice/" + e.invoices[0].id : ""}">
        <div class="sel-col">${selBox("emails", e.id)}</div>
        <div class="mail-avatar">${esc(initials(s.name))}</div>
        <div class="mail-main">
          <div class="mail-top"><div class="mail-from">${isNew ? `<span class="badge info" title="Its data hasn't been seen or saved yet">New</span> ` : ""}<b>${esc(s.name)}</b>${s.addr ? ` <span class="muted mono">${esc(s.addr)}</span>` : ""}</div>
            <div class="muted mail-time" title="${esc(fmtTime(e.received_at))}">${esc(ago(e.received_at))} · ${esc(fmtTime(e.received_at))}</div></div>
          <div class="mail-subject">${esc(e.subject || "(no subject)")}</div>
          ${e.classification || e.classification_reason ? `<div class="mail-verdict">${e.classification ? verdictBadge(e.classification) : ""}${e.bank_name ? `<b>${esc(e.bank_name)}</b>` : ""}${e.classification_reason ? `<span class="mail-reason muted" title="${esc(e.classification_reason)}">${esc(e.classification_reason)}</span>` : ""}</div>` : ""}
          ${files ? `<div class="mail-files">${files}</div>` : ""}
        </div>
        <div class="mail-actions">${isNew ? `<button class="icon" data-action="email-seen" data-id="${e.id}" title="Mark as seen">${ICON.eye}</button>` : ""}<span class="muted mail-ids">${e.invoices.map((i) => "#" + i.id).join(" ")}</span>
          <button class="icon danger" data-action="delete-email" data-id="${e.id}" data-name="${esc(e.subject || "(no subject)")}" title="Delete this email and its extracted data">${ICON.trash}</button></div>
      </div>`;
    }).join("");
    return pageHeader("Emails", "Every inbox email with a PDF / Excel attachment. The AI decides whether it's bank-related; only those go on to WhatsApp.",
      syncButton + (all.filter(tests.new).length ? `<button data-action="emails-seen-all">${ICON.eye} Mark all seen</button>` : "") + (all.length ? clearButton("emails", "Delete all emails") : "")) + `
      <div class="chips">${chips.map(([v, l, n]) => `<a class="chip ${(filter || "") === v ? "active" : ""}" href="#emails${v ? "/" + v : ""}">${esc(l)} <span>${n}</span></a>`).join("")}</div>
      ${emails.length ? `<div class="panel sel-scope">
        <div class="mail-head"><div class="sel-col">${selAll("emails")}</div><span class="muted">Select all · ${emails.length} email${emails.length === 1 ? "" : "s"}</span></div>
        <div class="mail-list">${cards}</div></div>`
        : `<div class="panel"><div class="empty-state">${all.length ? "No emails match this filter." : "No emails fetched yet. New inbox emails with a PDF attachment will show up here."}</div></div>`}`;
  },

  async invoices(filter) {
    const all = await api("/invoices");
    const groups = { saved: ["CONFIRMED"], waiting: ["PENDING_CONFIRMATION"], failed: ["FAILED_PARSE", "SEND_FAILED"], skipped: ["REJECTED", "NOT_BANK", "STATEMENT", "UNKNOWN_BANK", "MERGED"] };
    const of = (k) => all.filter((i) => groups[k].includes(i.status));
    const list = groups[filter] ? of(filter) : all;
    const chips = [["", "All", all.length], ["saved", "Saved to sheet", of("saved").length], ["waiting", "Awaiting reply", of("waiting").length], ["failed", "Failed", of("failed").length], ["skipped", "Skipped", of("skipped").length]];
    return pageHeader("Extracted data", "What was read from each PDF attachment", syncButton + (all.length ? clearButton("extracted", "Delete all extracted data") : "")) +
      `<div class="chips">${chips.map(([v, l, n]) => `<a class="chip ${(filter || "") === v ? "active" : ""}" href="#invoices${v ? "/" + v : ""}">${esc(l)} <span>${n}</span></a>`).join("")}</div>
      <div class="panel">${list.length ? invoiceTable(list) : `<div class="empty-state">${all.length ? "Nothing with this status." : "Nothing extracted yet."}</div>`}</div>`;
  },

  async invoice(id) {
    // PDF text never changes; only re-fetch the record/messages on refresh.
    contentCache[id] ??= api(`/invoices/${id}/content`).catch((e) => { delete contentCache[id]; throw e; });
    const [inv, content] = await Promise.all([api(`/invoices/${id}`), contentCache[id]]);
    const field = (k, v) => `<div><div class="k">${esc(k)}</div><div class="v ${v ? "" : "empty"}">${v ? esc(v) : "not found"}</div></div>`;
    const st = content.statement;
    const txns = inv.transactions;
    const canResend = (!st || txns.length) && ["SEND_FAILED", "PENDING_CONFIRMATION"].includes(inv.status);

    let summaryHtml, rowsHtml = "";
    if (st) {
      const t = st.totals;
      const c = inv.transaction_counts || {};
      summaryHtml = `<div class="panel"><h2>Statement summary <span class="right">read exactly from the PDF · no LLM</span></h2><div class="panel-body">
        ${t.unreconciled ? `<div class="alert warn">${t.unreconciled} row(s) don't match the running balance. Check those against the PDF.</div>` : `<div class="alert info">All ${t.count} rows match the running balance.</div>`}
        ${!txns.length ? `<div class="alert info">Account statements aren't tracked — only invoices / bank documents are. Shown here for reference; nothing was sent or saved.</div>` : ""}
        ${inv.extra?.duplicates_skipped ? `<div class="alert info">${inv.extra.duplicates_skipped} row(s) were already in an earlier statement, so they weren't sent again.</div>` : ""}
        <div class="kv">
          ${field("Period", inv.txn_date || `${st.rows[0].date} – ${st.rows[st.rows.length - 1].date}`)}
          <div><div class="k">Opening balance</div><div class="v">${money(st.opening)}</div></div>
          <div><div class="k">Credits (${st.rows.filter((r) => r.credit != null).length})</div><div class="v credit">${money(t.credit)}</div></div>
          <div><div class="k">Debits (${st.rows.filter((r) => r.debit != null).length})</div><div class="v debit">${money(t.debit)}</div></div>
          <div><div class="k">Closing balance</div><div class="v">${money(st.closing)}</div></div>
          ${txns.length ? `<div><div class="k">WhatsApp progress</div><div class="v">${c.CONFIRMED || 0} saved · ${c.REJECTED || 0} skipped · ${c.PENDING_CONFIRMATION || 0} awaiting reply${c.SEND_FAILED ? ` · <span class="debit">${c.SEND_FAILED} failed</span>` : ""}</div></div>` : ""}
        </div></div></div>`;
      rowsHtml = txns.length ? `<div class="panel"><h2>Transactions <span class="right">${txns.length} rows · confirmed together with one WhatsApp reply</span></h2>${txnTable(txns, { showPdf: false })}</div>`
        : `<div class="panel"><h2>Transactions (preview) <span class="right">${st.rows.length} rows</span></h2>
          <div class="table-wrap scroll"><table>
          <thead><tr><th>Date</th><th>Party</th><th>Details</th><th class="num">Debit</th><th class="num">Credit</th><th class="num">Balance</th></tr></thead>
          <tbody>${st.rows.map((r) => `<tr${r.reconciled ? "" : ' style="background:var(--warn-bg)"'}>
            <td class="nowrap">${esc(r.date)}</td><td><b>${esc(r.party || "")}</b></td><td class="muted">${esc(r.details)}</td>
            <td class="num debit">${money(r.debit)}</td><td class="num credit">${money(r.credit)}</td><td class="num">${money(r.balance)}</td></tr>`).join("")}
          </tbody></table></div></div>`;
    } else {
      const x = inv.extra || {};
      const amount = inv.amount ? `${x.currency || ""} ${inv.amount}`.trim() : null;
      const fact = (k, v, mono) => `<div class="fact"><div class="k">${esc(k)}</div><div class="v ${v ? (mono ? "mono" : "") : "empty"}">${v ? esc(v) : "—"}</div></div>`;
      const detail = [["Issued by (letterhead)", x.issuer_name], ["From (payer)", inv.sender_name], ["From account", x.sender_account], ["To (payee)", inv.receiver_name], ["To account", x.receiver_account],
        ["Purpose", x.purpose], ["Bank (as read)", x.bank_name], ["Amount check", x.amount_sanity_check && x.amount_sanity_check !== "no_regex_match" ? x.amount_sanity_check : null]];
      const found = detail.filter(([, v]) => v), missing = detail.filter(([, v]) => !v).map(([k]) => k);
      const reason = x.classification_reason ? `<div class="inv-reason ${inv.status === "NOT_BANK" ? "warn" : ""}"><b>${inv.status === "NOT_BANK" ? "Rejected" : "Selected"}</b> ${esc(x.classification_reason)}</div>` : "";
      summaryHtml = `<div class="inv-facts">${fact("Reference", inv.reference_number, true)}${fact("Date", inv.txn_date)}${fact("Amount", amount)}${fact("Document", x.document_type)}</div>
        <div class="panel"><h2>Details <span class="right">${esc(x.extraction_method || "")}${x.llm_model ? " · " + esc(x.llm_model) : ""}</span></h2><div class="panel-body">
        ${reason}
        ${content.kind === "pdf_scanned" ? `<div class="alert info">Scanned PDF (no text layer): the AI read the page images directly.</div>` : ""}
        ${found.length ? `<div class="kv">${found.map(([k, v]) => field(k, v)).join("")}</div>` : `<div class="muted">No further details were read.</div>`}
        ${missing.length ? `<div class="muted inv-missing">Not in the document: ${missing.map(esc).join(" · ")}</div>` : ""}
        ${(x.document_details || []).map((d) => `<h3 class="inv-h3">${esc(d.document || "Document")}</h3>
          <div class="kv">${(d.details || []).map((f) => field(f.label, f.value)).join("")}</div>`).join("")}
      </div></div>
      ${x.items_table?.rows?.length ? `<div class="panel"><h2>Items in the document <span class="right">${x.items_table.rows.length} line${x.items_table.rows.length === 1 ? "" : "s"}</span></h2>
        <div class="table-wrap"><table><thead><tr>${(x.items_table.columns || []).map((c) => `<th>${esc(c)}</th>`).join("")}</tr></thead>
        <tbody>${x.items_table.rows.map((r) => `<tr>${r.map((v) => `<td>${esc(v)}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>` : ""}`;
    }

    const sourcePanel = `<div class="panel"><h2>Source email</h2><div class="panel-body kv inv-source">
        ${field("From", inv.email_sender)}${field("Subject", inv.email_subject)}${field("Fetched", fmtTime(inv.created_at))}${field("Bank", `${inv.bank_name} (${inv.bank_code})`)}
      </div></div>`;
    const waPanel = `<div class="panel"><h2>WhatsApp conversation <span class="right">${inv.messages.length} message${inv.messages.length === 1 ? "" : "s"}</span></h2>${chat(inv.messages)}</div>`;
    const emailFrame = content.kind === "email" ? `<div class="panel"><h2>Email <span class="right"><a href="/api/invoices/${inv.id}/pdf" target="_blank" rel="noopener">Open full page ↗</a></span></h2>
        <iframe src="/api/invoices/${inv.id}/pdf" title="Email" style="width:100%;height:600px;border:0;display:block"
          onload="try { this.style.height = this.contentDocument.documentElement.scrollHeight + 'px'; } catch {}"></iframe></div>` : "";
    const rawPanel = `<div class="panel"><details><summary>Raw text read from the ${content.kind === "email" ? "email" : "PDF"} ${content.text ? `<span class="muted">(${content.text.length.toLocaleString()} characters)</span>` : ""}</summary>
        <div class="panel-body">${content.text ? `<pre class="text">${esc(content.text)}</pre>` : `<span class="muted">${content.kind === "pdf_scanned" ? "Scanned PDF: no text layer. Open the file to see it." : "No text available."}</span>`}</div></details></div>`;

    return pageHeader(`${inv.bank_name} · #${inv.id}`, `${statusBadge(inv.status)}${needsFormatBadge(inv.needs_format)} <span class="muted">${esc(inv.pdf_filename.replace(/^[^_]+_/, ""))}</span>`,
      `<button data-action="back">← Back</button>
       <a class="btn" href="/api/invoices/${inv.id}/pdf" target="_blank" rel="noopener">${content.kind === "email" ? "Open email" : "Open file"} ↗</a>
       <button class="danger" data-action="delete" data-id="${inv.id}" data-name="${esc(inv.pdf_filename.replace(/^[^_]+_/, ""))}">${ICON.trash} Delete</button>
       <button class="${inv.status === "FAILED_PARSE" ? "primary" : ""}" data-action="reparse" data-id="${inv.id}" data-status="${inv.status}" ${parsing.has(String(inv.id)) ? "disabled" : ""}>${parsing.has(String(inv.id)) ? `<span class="spin"></span> Parsing…` : "↻ Re-parse file"}</button>
       ${canResend ? `<button class="primary" data-action="resend" data-id="${inv.id}">Resend on WhatsApp</button>` : ""}`) + `
      ${inv.parse_error && !st ? `<div class="alert bad"><b>Parse error:</b> ${esc(inv.parse_error)}</div>` : ""}
      ${content.error ? `<div class="alert bad"><b>Couldn't read PDF:</b> ${esc(content.error)}</div>` : ""}
      ${st ? `${sourcePanel}${summaryHtml}${rowsHtml}${emailFrame}${waPanel}`
        : `<div class="inv-detail"><div class="inv-main">${summaryHtml}${rowsHtml}${emailFrame}</div><div class="inv-aside">${sourcePanel}${waPanel}</div></div>`}
      ${rawPanel}`;
  },

  async transactions(filter) {
    const list = await api("/transactions" + (filter ? `?status=${encodeURIComponent(filter)}` : ""));
    const all = filter ? await api("/transactions") : list;
    const count = (s) => all.filter((t) => t.status === s).length;
    const chips = [["", "All", all.length], ["PENDING_CONFIRMATION", "Awaiting reply", count("PENDING_CONFIRMATION")],
      ["CONFIRMED", "Saved", count("CONFIRMED")], ["REJECTED", "Skipped", count("REJECTED")], ["SEND_FAILED", "Send failed", count("SEND_FAILED")]];
    return pageHeader("Transactions", "Every statement row. Each statement is sent as one WhatsApp message; 👍 saves all its rows to the sheet, 👎 skips them.", syncButton) + `
      <div class="chips">${chips.map(([v, l, n]) => `<a class="chip ${(filter || "") === v ? "active" : ""}" href="#transactions${v ? "/" + v : ""}">${esc(l)} <span>${n}</span></a>`).join("")}</div>
      <div class="panel">${list.length ? txnTable(list, { showPdf: true }) : `<div class="empty-state">No transactions${filter ? " with this status" : " yet. They appear when a bank statement PDF arrives"}.</div>`}</div>`;
  },

  async whatsapp(filter) {
    const [all, s] = await Promise.all([api("/whatsapp/messages"), api("/status")]);
    const wa = s.whatsapp.openwa;
    const ready = wa && wa.status === "ready";
    const tests = { out: (m) => m.direction === "out", in: (m) => m.direction === "in", failed: (m) => m.status === "failed" };
    const msgs = tests[filter] ? all.filter(tests[filter]) : all;
    const chips = [["", "All", all.length], ["out", "Sent", all.filter(tests.out).length], ["in", "Received", all.filter(tests.in).length], ["failed", "Failed", all.filter(tests.failed).length]];
    const rows = msgs.map((m) => `<tr>
        <td class="sel-col">${selBox("messages", m.id)}</td>
        <td class="nowrap">${esc(fmtTime(m.created_at))}</td>
        <td><span class="badge ${m.direction === "out" ? "info" : "ok"}">${m.direction === "out" ? "→ Sent" : "← Received"}</span></td>
        <td class="mono nowrap">${esc(m.peer_number || "—")}</td>
        <td><div class="msg-text">${esc(m.text)}</div>${m.error ? `<div class="debit" style="font-size:12px">${esc(m.error)}</div>` : ""}</td>
        <td class="nowrap">${m.transaction_id ? `<a href="#invoice/${m.invoice_id}">T${m.transaction_id}</a>` : m.invoice_id ? `<a href="#invoice/${m.invoice_id}">#${m.invoice_id}</a>` : "—"}</td>
        <td>${msgBadge(m.status)}</td>
        <td><button class="icon danger" data-action="msg-delete" data-id="${m.id}" title="Delete this message">${ICON.trash}</button></td></tr>`).join("");
    return pageHeader("WhatsApp", "Every message the bot sent or received, with delivery status") + `
      <div class="wa-banner ${wa && !ready ? "bad" : "ok"}">
        <span class="wa-ico">${wa && !ready ? "!" : "✓"}</span>
        <div class="wa-text"><b>${wa && !ready ? "WhatsApp is not connected" : "WhatsApp is connected"}</b>
          <div>${wa && !ready ? openwaProblem(wa, s.whatsapp.openwa_url) : wa ? `Sending as ${wa.phone ? "+" + esc(wa.phone) : "the bot number"}${wa.pushName ? ` (${esc(wa.pushName)})` : ""}. Approval messages will be delivered.` : "Using the Meta Cloud API."}</div></div>
        ${wa && !ready && s.whatsapp.openwa_url ? `<a class="btn" href="${esc(s.whatsapp.openwa_url)}" target="_blank" rel="noopener">Open OpenWA ↗</a>` : ""}
      </div>
      <div class="wa-grid">
        <div class="panel"><h2>Send approvals to</h2>
          <form id="notify-form" class="panel-body" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
            <input class="field" name="numbers" value="${esc(s.whatsapp.notify_numbers.join(", "))}" placeholder="923001234567" required style="flex:1;min-width:180px">
            <button class="primary" type="submit">Save</button>
            <div class="muted" style="font-size:12px;flex-basis:100%">Full number with country code (e.g. 923001234567). New approval requests go to this number, and Yes/No replies are accepted from it. Requests already sent stay with the number they went to. Set in ${esc(s.whatsapp.notify_numbers_source)}.</div>
          </form></div>
        <div class="panel"><h2>Details</h2><div class="panel-body kv" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr))">
          <div><div class="k">Provider</div><div class="v">${esc(s.whatsapp.provider === "openwa" ? "OpenWA (self-hosted)" : "Meta Cloud API")}</div></div>
          ${wa ? `<div><div class="k">Session</div><div class="v"><span class="badge ${ready ? "ok" : "bad"}">${esc(wa.status)}</span></div></div>
          <div><div class="k">Bot number</div><div class="v">${wa.phone ? "+" + esc(wa.phone) : "—"}</div></div>` : ""}
          <div><div class="k">Messages logged</div><div class="v">${all.length}</div></div>
        </div></div>
      </div>
      <div class="panel"><h2>Message log
          <span class="right" style="display:flex;align-items:center;gap:12px">${all.length} message${all.length === 1 ? "" : "s"}${all.length ? `<button class="danger" data-action="msg-clear" data-count="${all.length}">${ICON.trash} Clear log</button>` : ""}</span></h2>
        <div class="chips" style="padding:12px 16px 0;margin:0">${chips.map(([v, l, n]) => `<a class="chip ${(filter || "") === v ? "active" : ""}" href="#whatsapp${v ? "/" + v : ""}">${esc(l)} <span>${n}</span></a>`).join("")}</div>
        ${msgs.length ? `<div class="table-wrap scroll" style="margin-top:12px"><table><thead><tr><th class="sel-col">${selAll("messages")}</th><th>Time</th><th>Direction</th><th>Number</th><th>Message</th><th>For</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`
          : `<div class="empty-state">${all.length ? "No messages match this filter." : "No messages yet. When a PDF is extracted, the approval request will show up here."}</div>`}
      </div>`;
  },

  // Every stock report the bot has made, kept per firm; one opens in the page, as the Excel sheet looks.
  async inventory(key) {
    const { firms } = await api("/inventory");
    if (!firms.length) return pageHeader("Stock Reports", "Every stock report, firm by firm.") + `<div class="empty-state">No stock reports yet. They appear here as soon as a delivery order or takeover letter is confirmed on WhatsApp.</div>`;
    const chosen = Math.max(0, firms.findIndex((f) => f.key === decodeURIComponent(key || "")));
    const options = firms.map((f, i) => `<button class="dd-opt ${i === chosen ? "sel" : ""}" role="option" data-firm="${i}"><span class="dd-name">${esc(f.name)}</span><span class="dd-count">${f.reports.length}</span></button>`).join("");
    const lists = firms.map((f, i) => {
      let month = "", rows = "";
      for (const r of f.reports) {
        if (r.month !== month) {
          month = r.month;
          const [y, m] = month.split("-");
          rows += `<div class="inv-month">${esc(new Date(+y, +m - 1).toLocaleString(undefined, { month: "long", year: "numeric" }))}</div>`;
        }
        rows += `<div class="inv-row" data-ref="${esc(r.ref)}" data-date="${esc(r.date.split("-").reverse().join("-"))}">
          <input type="checkbox" class="inv-check" data-ref="${esc(r.ref)}" aria-label="Select this report">
          <button class="inv-pick" data-action="inv-open" data-ref="${esc(r.ref)}" data-name="${esc(r.name)}" data-xlsx="${r.xlsx ? 1 : 0}"><b>${esc(r.date)}</b><span class="muted">${r.record ? "#" + esc(r.record) : ""}</span></button>
          <button class="inv-del" data-action="inv-delete" data-ref="${esc(r.ref)}" data-name="${esc(r.name)}" title="Delete this report">✕</button></div>`;
      }
      return `<div class="panel inv-list ${i === chosen ? "active" : ""}" data-firm="${i}" data-key="${esc(f.key)}" data-first="${esc(f.reports[0].ref)}"><h2>${esc(f.name)} <span class="right">${f.reports.length} report${f.reports.length === 1 ? "" : "s"}</span></h2>
        <div class="inv-bar-sel"><label><input type="checkbox" class="inv-all"> Select all</label><span class="muted inv-count"></span>
          <button class="danger" data-action="inv-delete-selected" disabled>Delete selected</button></div>${rows}</div>`;
    }).join("");
    // No page heading: the report itself runs from the top of the window; the firm picker, file buttons and dates sit beside it.
    return `
      <div class="inv"><div class="inv-side">
      <div class="chips" title="${firms.length} firm${firms.length === 1 ? "" : "s"}">
        <div class="dd" id="inv-dd">
          <button class="dd-btn" type="button" aria-haspopup="listbox" aria-expanded="false">
            <span class="dd-name" id="dd-label">${esc(firms[chosen].name)}</span><span class="dd-count" id="dd-count">${firms[chosen].reports.length}</span>
            <svg class="dd-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m6 9 6 6 6-6"/></svg></button>
          <div class="dd-menu" role="listbox">${options}</div>
        </div>

// Why the OpenWA session can't send, and what to do about it on the gateway.
function openwaProblem(wa, url) {
  const link = url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(url.replace(/^https?:\/\//, ""))}</a>` : "the OpenWA dashboard";
  if (wa.status === "qr_ready") return `The WhatsApp session is waiting for a QR scan. Open the session in ${link} and scan the QR from the bot phone (WhatsApp → Linked devices).`;
  if (wa.status === "unreachable") return `Can't reach OpenWA at ${link}${wa.error ? `: ${esc(wa.error)}` : ""}. Check that the gateway is up.`;
  if (wa.status === "not_configured") return "OPENWA_API_KEY / OPENWA_SESSION_ID aren't set.";
  return `The WhatsApp session is ${esc(wa.status)}${wa.error ? `: ${esc(wa.error)}` : ""}. Reconnect it in ${link}.`;
}

// Incoming emails: show 5 rows, scroll for the rest. Rows differ in height
// (wrapped steps, reasons), so the box is sized from the real rows.
const ACTIVITY_VISIBLE_ROWS = 5;
function fitActivityRows() {
  const box = $(".activity-scroll");
  if (!box) return;
  const rows = box.querySelectorAll("tbody tr");
  if (rows.length <= ACTIVITY_VISIBLE_ROWS) { box.style.maxHeight = ""; return; }
  const head = box.querySelector("thead")?.offsetHeight || 0;
  let h = head;
  for (let i = 0; i < ACTIVITY_VISIBLE_ROWS; i++) h += rows[i].offsetHeight;
  box.style.maxHeight = `${h + 2}px`;
}
window.addEventListener("resize", fitActivityRows);

/* ---------- Notification bell ---------- */
const bellState = { events: [], alerts: [], toasted: null };
const BELL_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>`;

// Problems that are true right now (not events): shown at the top until they are fixed.
function liveAlerts(s) {
  const alerts = [], wa = s.whatsapp.openwa;
  if (wa ? wa.status !== "ready" : false) alerts.push({ tone: "bad", title: "WhatsApp is not connected", text: `Status: ${wa.status}. Approval requests can't be sent until it is connected.`, link: "#whatsapp" });
  if (!s.gmail.initialized) alerts.push({ tone: "warn", title: "Gmail hasn't started", text: "New emails aren't being checked yet.", link: "#settings" });
  if (!s.llm.configured) alerts.push({ tone: "bad", title: "The AI service isn't set up", text: "No API key: documents can't be read.", link: "#settings" });
  return alerts;
}

function renderBell() {
  const unread = bellState.events.filter((e) => e.unread).length;
  const total = unread + bellState.alerts.length;
  const badge = $("#bell-count");
  badge.hidden = !total;
  badge.textContent = total > 9 ? "9+" : total;
  $("#bell").classList.toggle("has", total > 0);
  const panel = $("#notif");
  if (panel.hidden) return;
  const item = (n, extra = "") => `<a class="notif-item ${extra}" href="${esc(n.link || "#overview")}"><span class="n-ico ${n.tone}">${{ bad: "!", warn: "!", ok: "✓", info: "i", neutral: "·" }[n.tone] || "i"}</span>
    <div class="n-body"><div class="n-title">${esc(n.title)}</div><div class="n-text">${esc(n.text)}</div>${n.at ? `<div class="n-time">${esc(ago(n.at))}</div>` : ""}</div>${n.unread ? `<span class="n-dot"></span>` : ""}</a>`;
  const list = [...bellState.alerts.map((a) => item(a, "alert")), ...bellState.events.map((e) => item(e))].join("");
  panel.innerHTML = `<div class="notif-head"><b>Notifications</b>${unread ? `<button type="button" data-notif="read">Mark all read</button>` : ""}</div>
    <div class="notif-list">${list || `<div class="empty-state">You're all caught up.</div>`}</div>`;
}

async function refreshBell(s) {
  try {
    const d = await api("/notifications");
    bellState.events = d.events;
    bellState.alerts = liveAlerts(s);
    // A toast for what is new since the page was opened (not for what was already waiting).
    const fresh = d.events.filter((e) => e.unread);
    if (bellState.toasted === null) bellState.toasted = new Set(fresh.map((e) => e.id));
    else {
      const news = fresh.filter((e) => !bellState.toasted.has(e.id));
      news.forEach((e) => bellState.toasted.add(e.id));
      if (news.length) toast(news.length > 1 ? `${news.length} new notifications` : `${news[0].title}${news[0].text ? " · " + news[0].text.slice(0, 70) : ""}`, 5000, news.some((e) => e.tone === "bad") ? "warn" : "");
    }
    renderBell();
  } catch { /* the bell is best-effort */ }
}

document.addEventListener("click", async (ev) => {
  const panel = $("#notif");
  if (ev.target.closest("#bell")) { panel.hidden = !panel.hidden; renderBell(); return; }
  if (ev.target.closest("[data-notif=read]")) {
    await api("/notifications/read", { method: "POST" });
    bellState.events.forEach((e) => { e.unread = false; });
    renderBell();
    return;
  }
  if (!panel.hidden && (ev.target.closest(".notif-item") || !ev.target.closest("#notif"))) panel.hidden = true;
});
document.addEventListener("keydown", (ev) => { if (ev.key === "Escape") $("#notif").hidden = true; });

async function showCombined() {

/* ---------- Stock Reports: open a report in the page ---------- */
const refUrl = (ref) => "/api/inventory/file/" + ref.split("/").map(encodeURIComponent).join("/");
function openReport(ref, name, xlsx = true) {
  const frame = $("#inv-frame");
  if (!frame) return;
  $(".inv-view").classList.remove("table-mode");
  frame.classList.add("loading");
  frame.onload = () => frame.classList.remove("loading");
  setTimeout(() => frame.classList.remove("loading"), 1500);  // a PDF viewer may not fire load
  // The viewer's own dark toolbar and thumbnail pane are hidden; the page fits the width and starts at the top.
  frame.src = refUrl(ref) + ".pdf#toolbar=0&navpanes=0&view=FitH";
  $("#inv-title").textContent = name;
  const links = { "#inv-xlsx": [refUrl(ref) + ".xlsx", xlsx], "#inv-pdf": [refUrl(ref) + ".pdf?download=true", true], "#inv-tab": [refUrl(ref) + ".pdf", true] };
  for (const [sel, [href, show]] of Object.entries(links)) { const a = $(sel); a.href = href; a.hidden = !show; }
  document.querySelectorAll(".inv-row").forEach((row) => row.classList.toggle("active", row.dataset.ref === ref));
}
function openFirstReport() {
  const list = $(".inv-list.active");
  const first = list && list.querySelector(`.inv-pick[data-ref="${CSS.escape(list.dataset.first)}"]`);
  if (first) openReport(first.dataset.ref, first.dataset.name, first.dataset.xlsx === "1");
}

// Choosing a firm in the drop-down: its list slides in and its newest report opens, without reloading the page.
function switchFirm(index) {
  const lists = document.querySelectorAll(".inv-list");
  const target = lists[index];
  if (!target || target.classList.contains("active")) return;
  lists.forEach((l) => l.classList.remove("active"));
  void target.offsetWidth;  // restart the slide-in animation
  target.classList.add("active");
  target.scrollTop = 0;
  const options = document.querySelectorAll(".dd-opt");
  options.forEach((o, i) => o.classList.toggle("sel", i === index));
  const label = $("#dd-label");
  label.style.opacity = 0;
  setTimeout(() => {
    label.textContent = options[index].querySelector(".dd-name").textContent;
    $("#dd-count").textContent = options[index].querySelector(".dd-count").textContent;
    label.style.opacity = 1;
  }, 110);
  history.replaceState(null, "", "#inventory/" + encodeURIComponent(target.dataset.key));
  openFirstReport();
  applyRange();  // the chosen days apply to this factory's list too
}

const closeDropdown = () => {
  const dd = $("#inv-dd");
  if (dd) { dd.classList.remove("open"); $(".dd-btn", dd).setAttribute("aria-expanded", "false"); }
};
document.addEventListener("click", (ev) => {
  const dd = $("#inv-dd");
  if (!dd) return;
  const option = ev.target.closest(".dd-opt");
  if (option) { switchFirm(+option.dataset.firm); closeDropdown(); return; }
  if (ev.target.closest(".dd-btn")) {
    const open = dd.classList.toggle("open");
    $(".dd-btn", dd).setAttribute("aria-expanded", String(open));
  } else closeDropdown();
});
document.addEventListener("keydown", (ev) => { if (ev.key === "Escape") closeDropdown(); });

let currentRoute = "";
async function render({ quiet = false } = {}) {
  const hash = location.hash.slice(1) || "overview";
  const [tab, id] = hash.split("/");
  const view = tab === "invoice" ? "invoice" : (views[tab] ? tab : "overview");
  const navTab = view === "invoice" ? "invoices" : view;
  document.querySelectorAll("#nav a").forEach((a) => a.classList.toggle("active", a.dataset.tab === navTab));
  const route = hash;
  main.classList.toggle("fit", view === "inventory");
  if (!quiet && route !== currentRoute) main.innerHTML = `<div class="empty-state">Loading…</div>`;
  try {
    const html = await views[view](id);
    // The user may have clicked elsewhere while this loaded; don't overwrite that page.
    if ((location.hash.slice(1) || "overview") === route) {
      const scrollY = window.scrollY;
      const inner = $(".activity-scroll")?.scrollTop || 0;
      main.innerHTML = html;
      fitActivityRows();
      applySelection();
      openFirstReport();
      if (quiet) {
        window.scrollTo(0, scrollY);
        const box = $(".activity-scroll");
        if (box) box.scrollTop = inner;  // keep the list where the user scrolled it
      }
    }
    currentRoute = route;
  } catch (e) {
    if (!quiet) main.innerHTML = `<div class="alert bad">Couldn't load this page: ${esc(e.message)}</div>`;
  }
}

    }))) return;

    body: `<p><b>${esc(btn.dataset.name)}</b></p><p>Its extracted data and statement rows are removed from the dashboard and the file is deleted from disk.</p>${keepNote}`,
  }))) return;
  if (btn.dataset.action === "delete-email" && !(await askDialog({

  }))) return;

      extracted: ["Delete all extracted data?", "<b>every extracted file</b> (records, statement rows, the files on disk). The emails stay in the list."],
      everything: ["Delete everything?", "<b>all emails, extracted data, statement rows, WhatsApp messages and one-off stock reports</b>. The Stock Reports tab is kept."] }[btn.dataset.scope];
    if (!(await askDialog({
      title: what[0], typeWord: "DELETE", confirmLabel: "Delete",
      body: `<p>This removes ${what[1]}</p><p>It cannot be undone.</p><div class="keep">Gmail, the Google Sheet, the report formats and the settings are not touched.</div>`,
    }))) return;
    clearConfirm = "DELETE";
  }
  if (btn.dataset.action === "delete-selected") {

    const lines = [ne && `<b>${ne} email${ne > 1 ? "s" : ""}</b> and everything read from ${ne > 1 ? "them" : "it"}`, ni && `<b>${ni} extracted file${ni > 1 ? "s" : ""}</b>`, nm && `<b>${nm} WhatsApp message${nm > 1 ? "s" : ""}</b> from the log`].filter(Boolean);
    if (!(await askDialog({
      title: `Delete ${count.join(" and ")}?`, confirmLabel: "Delete selected",
      body: `<p>This removes ${lines.join(" and ")} from the dashboard.</p><p>It cannot be undone.</p>${keepNote}`,
    }))) return;
  }
  if (btn.dataset.action === "clear-selection") { sel.emails.clear(); sel.invoices.clear(); applySelection(); return; }
  if (btn.dataset.action === "reparse" && btn.dataset.status === "CONFIRMED" && !(await askDialog({
    title: "Read this document again?", confirmLabel: "Read again", danger: false,

  }))) return;
  if (btn.dataset.action === "msg-delete" && !(await askDialog({
    title: "Delete this message?", confirmLabel: "Delete",
    body: `<p>It is removed from the log shown here only, not from WhatsApp.</p>`,
  }))) return;
  if (btn.dataset.action === "goods-clear" && !(await askDialog({
    title: "Forget these figures?", confirmLabel: "Forget",
    body: `<p><b>${esc(btn.dataset.name)}</b></p><p>Its margin, weight and rate are removed. The next invoice of these goods will ask for them again. Reports already made are not changed.</p>`,
  }))) return;
  if (btn.dataset.action === "cad-remove" && !(await askDialog({

    body: `<p><b>${esc(btn.dataset.address)}</b>${btn.dataset.name ? ` (${esc(btn.dataset.name)})` : ""}</p><p>Emails from them will no longer be read${btn.dataset.last ? ", and as this is the last person on the list, emails from anyone will be read again" : ""}.</p>`,
  }))) return;

    } else if (btn.dataset.action === "reparse") {
      parsing.add(btn.dataset.id);

      let r;
      try {
        r = await api(`/invoices/${btn.dataset.id}/reparse`, { method: "POST" });

        parsing.delete(btn.dataset.id);
        showParsing();
      }
      toast(r.status === "FAILED_PARSE" ? "Still failing. See the error above."
        : r.transaction_counts ? (r.status === "SEND_FAILED" ? "WhatsApp send failed. See the conversation below." : r.status === "STATEMENT" ? "Account statement: not tracked, nothing sent." : `Sent ${r.transaction_counts.total} transactions on WhatsApp as one message`)
        : "Parsed" + (r.status === "PENDING_CONFIRMATION" ? " and sent on WhatsApp" : ""));
    } else if (btn.dataset.action === "retry") {
      toast("Retrying… watch the progress in the row");
      const r = await api(`/emails/${btn.dataset.id}/retry`, { method: "POST" });
      toast(r.prompts_sent ? "Processed and sent on WhatsApp" : "Processed");
    } else if (btn.dataset.action === "delete") {
      await api(`/invoices/${btn.dataset.id}`, { method: "DELETE" });

      toast("Deleted");
      if (location.hash.startsWith("#invoice/")) { location.hash = "#invoices"; return; }

      sel.emails.clear(); sel.invoices.clear(); sel.messages.clear();

      toast(r.messages && !r.emails && !r.invoices ? `Deleted ${r.messages} message${r.messages === 1 ? "" : "s"}`
        : `Deleted ${r.emails} email${r.emails === 1 ? "" : "s"} and ${r.invoices} file${r.invoices === 1 ? "" : "s"}${r.messages ? ` and ${r.messages} message${r.messages === 1 ? "" : "s"}` : ""}`);
    } else if (btn.dataset.action === "email-seen") {
      await api("/emails/seen", { method: "POST", body: { ids: [Number(btn.dataset.id)] } });
    } else if (btn.dataset.action === "emails-seen-all") {
      const r = await api("/emails/seen", { method: "POST", body: { all: true } });
      toast(`${r.marked} email${r.marked === 1 ? "" : "s"} marked as seen`);
    } else if (btn.dataset.action === "msg-delete") {
      await api("/data/delete", { method: "POST", body: { messages: [Number(btn.dataset.id)] } });
      sel.messages.delete(btn.dataset.id);

    } else if (btn.dataset.action === "msg-clear") {
      const r = await api("/whatsapp/messages/clear", { method: "POST" });
      sel.messages.clear();
      toast(`Message log cleared (${r.messages} deleted)`);
    } else if (btn.dataset.action === "delete-email") {
      await api(`/emails/${btn.dataset.id}`, { method: "DELETE" });

    } else if (btn.dataset.action === "clear") {
      const r = await api("/data/clear", { method: "POST", body: { scope: btn.dataset.scope, confirm: clearConfirm } });

    await Promise.all([render({ quiet: true }), refreshSidebar()]);
  } catch (e) {
    toast("Error: " + e.message);
  } finally {
    btn.disabled = false;
  }
});

});

document.addEventListener("change", (ev) => {
  if (!ev.target.matches("#rg-from, #rg-to")) return;
  document.querySelectorAll("[data-action=inv-range]").forEach((b) => b.classList.remove("active"));
  applyRange();
});

// False until the first in-app navigation: Back then has a page of ours to return to.
let navigatedInApp = false;
window.addEventListener("hashchange", () => { navigatedInApp = true; sel.emails.clear(); sel.invoices.clear(); sel.messages.clear(); render(); });
render();
refreshSidebar({ warnWhatsApp: true });
// Live-ish: pick up new emails, replies and delivery ticks without a manual reload.
// On the Overview, check a cheap fingerprint every 2 s and re-render as soon
// as it changes (new email, next processing step, WhatsApp tick). Other pages
// refresh every 16 s.
let tick = 0, lastVersion = null;
setInterval(async () => {
  // Don't re-render under the user: an open <details> or a field being typed in.
  if (document.hidden || location.hash === "#formats" || location.hash === "#cad" || location.hash === "#factories" || location.hash.startsWith("#inventory") || document.querySelector("details[open]") || document.activeElement?.matches("input, textarea")) return;
  tick += 1;
  const onOverview = (location.hash.slice(1) || "overview").startsWith("overview");
  if (onOverview) {
    try {
      const { v } = await api("/activity/version");
      if (v !== lastVersion || processingActive) {
        const first = lastVersion === null;
        lastVersion = v;
        if (!first) { render({ quiet: true }); refreshSidebar(); }
      }
    } catch { /* next tick */ }
  } else if (tick % 8 === 0) { render({ quiet: true }); refreshSidebar(); }
}, 2000);
</script>
</body>
</html>
